name: CI

on:
  push:
    branches: ['**'] # 所有分支的推送都触发（仅定义 tags 时分支推送不会触发，必须显式声明）
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE', '快速使用指南.txt']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'

jobs:
  # ── 自动测试：Windows/Linux × Python 3.12/3.13 矩阵 ──
  test:
    name: 测试 (${{ matrix.os }} / py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 安装 Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # PySide6 即使 offscreen 模式也需要系统级 Qt 依赖（libEGL/libGL 等）
      - name: 安装 Qt 系统依赖（仅 Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python -m pytest tests/ -v --tb=short
          --cov=core --cov=ui --cov-report=term-missing:skip-covered
          --cov-report=xml

      - name: 上传覆盖率报告（仅 windows / py3.13 一份）
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
          if-no-files-found: error

  # ── 云端打包 exe（每次推送都构建）──
  build:
    name: 打包 exe
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 安装 Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller 打包
        run: python build_exe.py

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = Get-Item ".\电子书转换工具.exe" -ErrorAction Stop
          "产物大小: $([math]::Round($exe.Length / 1MB, 1)) MB"
          if ($exe.Length -lt 1MB) { throw "产物异常：体积过小" }

      - name: 上传构建产物
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: EbookConverter-windows-x64
          path: 电子书转换工具.exe
          retention-days: 14
          if-no-files-found: error

  # ── 推送 v* 标签时自动发布 Release ──
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: EbookConverter-windows-x64
          path: artifact/

      - name: 创建 Release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2.0.9
        with:
          files: artifact/电子书转换工具.exe
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
